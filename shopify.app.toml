# Shopify app configuration. Run `shopify app config link` to bind this to your
# app in the Partner Dashboard, then `shopify app deploy` to push config.
# Replace CLIENT_ID and the URLs with your own.

client_id = "ec0d635c1ad9d7b09c968c797dd03d85"
name = "Support Assistant"
handle = "smukesh-support-app"
application_url = "https://shopify-support-assistant.vercel.app"
embedded = true

[access_scopes]
scopes = "read_orders,read_customers"
# Managed installation: Shopify installs the app and manages scope grants.
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://shopify-support-assistant.vercel.app/api/auth/callback"
]

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "https://shopify-support-assistant.vercel.app/api/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://shopify-support-assistant.vercel.app/api/webhooks"

# App Proxy: lets the storefront widget call our backend through Shopify with a
# signed request. Storefront path /apps/support/* -> our /api/proxy/*.
[app_proxy]
url = "https://shopify-support-assistant.vercel.app/api/proxy"
subpath = "support"
prefix = "apps"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
